name: Build O-Pilot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare Keystore
        run: |
          if [ ! -f "release.keystore" ]; then
            keytool -genkeypair -v -keystore release.keystore -alias opilotkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=OPilot, OU=Dev, O=OPilot, L=City, S=State, C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Build Mobile Release APK
        run: gradle :mobile:assembleRelease

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: o-pilot-mobile-release
          path: mobile/build/outputs/apk/release/*.apk
